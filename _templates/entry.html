<!DOCTYPE html>
<html lang="en">

{{ template "head" . }}

<body>
    {{ template "header" . }}
        
    <main class="container">
        <section id="preview">
            <h2>{{.Title}}</h2>
            <div id="content">{{.Content}}</div>
        </section>
    </main>

    <script>
    (function() {
        'use strict';
        var DPM = 30, MPY = 12, DPY = DPM * MPY;
        var BI = 4980 * DPY + 10 * DPM + 10;

        function rdToCi(rd) {
            var p = rd.split('.');
            if (p.length !== 4) return null;
            var tot = (+p[3]) * 1000 + (+p[2]) * 100 + (+p[1]) * 10 + (+p[0]);
            var idx = BI + tot;
            var y = Math.floor(idx / DPY);
            var r = idx % DPY;
            var m = Math.floor(r / DPM) + 1;
            var d = (r % DPM) + 1;
            return y + 'u-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
        }

        function ciToRd(ci) {
            var m = ci.match(/^(\d+)u?-(\d{1,2})-(\d{1,2})$/);
            if (!m) return null;
            var idx = (+m[1]) * DPY + ((+m[2]) - 1) * DPM + (+m[3]) - 1 - BI;
            if (idx < 0) return null;
            var days = idx % 10; idx = Math.floor(idx / 10);
            var w = idx % 10; idx = Math.floor(idx / 10);
            var mo = idx % 10; idx = Math.floor(idx / 10);
            var y = idx;
            return days + '.' + w + '.' + mo + '.' + y;
        }

        /* Attach click toggle to a date element */
        function makeToggle(el, rdHtml, ciText) {
            el.dataset.rd = rdHtml;
            el.dataset.ci = ciText;
            el.dataset.state = 'rd';
            el.title = ciText;
            el.addEventListener('click', function () {
                if (el.dataset.state === 'rd') {
                    el.innerHTML = el.dataset.ci;
                    el.title = el.dataset.rd.replace(/<[^>]+>/g, '');
                    el.dataset.state = 'ci';
                } else {
                    el.innerHTML = el.dataset.rd;
                    el.title = el.dataset.ci;
                    el.dataset.state = 'rd';
                }
            });
        }

        /* 1. Reladates in h4 — "8.4.7.12 R.D." */
        document.querySelectorAll('h4').forEach(function (el) {
            var m = el.textContent.match(/(\d+\.\d+\.\d+\.\d+)\s*R\.D\.?/i);
            if (m) {
                var ci = rdToCi(m[1]);
                if (ci) makeToggle(el, el.innerHTML, ci);
            }
        });

        /* 2. Castirian dates in content — "5016u-05-06" */
        document.querySelectorAll('h4, h5, p, li, td, div').forEach(function (el) {
            if (el.dataset.state) return;  /* already handled above */
            var m = el.textContent.match(/(\d+)u-(\d{2})-(\d{2})/);
            if (!m) return;
            var full = m[1] + 'u-' + m[2] + '-' + m[3];
            if (el.textContent.trim() !== full) return;  /* extra text, skip */
            var rd = ciToRd(full);
            if (!rd) return;
            makeToggle(el, rd + ' <span class="small-text">R.D.</span>', el.innerHTML);
        });
    })();
    </script>

</body>

</html>
